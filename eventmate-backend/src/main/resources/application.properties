spring.application.name=eventmate-backend

# Load environment variables from a local .env file if present
spring.config.import=optional:dotenv:./.env

# Database Configuration (all values from environment variables)
# Local fallback is an in-memory H2 database so the backend can start without a configured MySQL server.
spring.datasource.url=${DB_URL:jdbc:h2:mem:eventmate;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
# show-sql is set per-profile (true in dev, false in prod)
spring.jpa.show-sql=false
# Remove explicit MySQL dialect so Spring Boot auto-selects the driver/dialect based on the URL
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server Port
server.port=${PORT:8080}

# CORS — allowed frontend origins (comma-separated in production)
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# JWT Secret — must be a Base64-encoded key (min 256-bit for HS256)
# Generate one with: openss

l rand -base64 32
jwt.secret=${JWT_SECRET:NTM2NzU2NkI1OTcwMzM3MzM2NzYzOTc5MkY0MjNGNDUyODQ4MkI0RDYyNTE2NTU0Njg1NzZENUE3MTM0NzQzNw==}

# Frontend URL (used in emails, password reset links, etc.)
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# CORS — Allowed Origins (comma-separated)
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Cloudinary Configuration
cloudinary.cloud_name=${CLOUDINARY_NAME:}
cloudinary.api_key=${CLOUDINARY_KEY:}
cloudinary.api_secret=${CLOUDINARY_SECRET:}

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# AI Configuration (Gemini)
ai.api.key=${GEMINI_KEY:}
ai.api.url=${GEMINI_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent}

# Stripe Configuration
stripe.secret.key=${STRIPE_SECRET:}

# Redis Cache Configuration
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.cache.type=${CACHE_TYPE:redis}
